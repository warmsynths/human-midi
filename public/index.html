<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Human MIDI Engine</title>
    <script type="module" src="./human-engine.js"></script>
    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #121212;
      }
    </style>
  </head>
  <body>
    <human-panel></human-panel>
    <script>
      const panel = document.querySelector('human-panel');
      panel?.addEventListener('human-preview', (e) => {
        console.log('🎵 human-preview event received:', e.detail);
      });
      panel?.addEventListener('human-change', (e) => {
        console.log('⚙️ human-change event received:', e.detail);
      });
    </script>
  </body>
</html>
